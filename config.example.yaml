source:
  server_url: "https://om-source.example.com/api"
  token_env: "OM_SOURCE_TOKEN"
target:
  server_url: "https://om-target.example.com/api"
  token_env: "OM_TARGET_TOKEN"
migration:
  domains:
    - "Enterprise.Finance"
  include_subdomains: true
  include_dependencies: true
  primary_relationship: direct
  dependency_policy: required_only
  external_reference_policy: report
  output_dir: "./out"
  batch_size: 100
  discovery: full_scan  # Use domain to look up candidates for the selected domains.
  include_user_emails: false
  # table_batch_size: 2500  # Defaults to batch_size when omitted.
plan:
  show_progress: true
http:
  timeout_seconds: 30
  read_retries: 2
  requests_per_second: 0  # Zero disables request pacing.
import:
  on_conflict: update
  create_users: true
  user_emails: {}  # Optional target email by user FQN.
  # audit_file: ./migration.import-audit.ndjson
