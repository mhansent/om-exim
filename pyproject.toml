[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "om-exim"
version = "0.1.0"
description = "Read-only selective OpenMetadata migration planning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]
sdk = ["openmetadata-ingestion==2.0.0.0", "pytz==2026.1"]

[project.scripts]
om-exim = "om_exim.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:pytest_openmetadata"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
